<head>
    <!-- Agregar Font Awesome desde CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
    <div class="header-with-button">
        <button class="btn-toggle-examples" title="Show examples" (click)="callParentMethod('toggleEjemplos')">
            <i class="fa fa-lightbulb"></i>
        </button>

        <div class="editorTitle-container" style="display: flex; align-items: center;">
            <h3 style="margin: 0 10px 0 20px; padding-right: 0px;">Expressions editor</h3>
            <button class="btn-search" (click)="callParentMethod('showExpressions')" style="display: flex; align-items: center; justify-content: center; margin: 0;">
                <i class="fa fa-edit editorIcon" title="Edit your expressions"></i>
            </button>
        </div>

        <button (click)="callParentMethod('create')" title="Create expression" class="btn-toggle-createExp">
            <i class="fa fa-plus"></i>
        </button>
    </div>

    <div class="input-group">
        <input type="text"
            *ngIf="parent" 
            [(ngModel)]="parent.searchQuery"
            (dblclick)="callParentMethod('openTextArea', this, $event, 'Expressions')"
            (input)="callParentMethod('onSearchInput'); callParentMethod('checkForExpressions')"
            (keydown)="onTabPress($event)"
            (focus)="callParentMethod('onFocusInput')"
            placeholder="Double click to add multiple expressions"
            list="expressionsList">

        <datalist id="expressionsList">
            <option class="expOpt" *ngFor="let expression of parent.expressions" [value]="expression.jsExpression"></option>
        </datalist>

        <div class="buttons-container">
            <button class="btn-add" (click)="callParentMethod('addUserExpression'); parent.searchQuery = '';"
                [disabled]="parent?.isAddDisabled()">
                <i class="fa fa-plus" aria-hidden="true"></i> Add
            </button>
            <button *ngIf="parent?.userExpressions.length > 0" class="btn-clear" (click)="callParentMethod('clearExpressions')">
                <i class="fa fa-trash-alt" aria-hidden="true"></i> Clear
            </button>
        </div>

        <!-- Contenedor de recomendaciones -->
        <div class="suggestions" *ngIf="parent?.showRecommendations">
            <div class="suggestion-item" (click)="callParentMethod('selectRecommendation')">
            {{ parent?.recommendation }}
            </div>
        </div>
  
    </div>

    <div class="expression-list" *ngFor="let userExpression of parent.userExpressions; let i = index">
        <code>{{ userExpression }}</code>
        <a class="deleteButton" (click)="callParentMethod('removeUserExpression', i)">
            <i class="fas fa-delete-left" style="padding-right: 5px; font-size: 13px;"></i> Remove
        </a>
        <a class="saveButton" title="Save expression" (click)="callParentMethod('saveUserExpression', i)">
            <i class="fas fa-save" style="font-size: 13px;"></i>
        </a>
    </div>

    <div class="btn-container">
        <button class="btn-apply" *ngIf="!isDeterministic" (click)="callParentMethod('fillTableWithUserExpressions')"
            [disabled]="parent?.userExpressions.length <= 0">
            <i class="fa fa-list-check" aria-hidden="true"></i> Apply expressions
        </button>
        <button class="btn-apply" *ngIf="isDeterministic" (click)="callParentMethod('fillTableWithUserExpressions')"
            [disabled]="parent?.userExpressions.length <= 0">
            <i class="fa fa-list-check" aria-hidden="true"></i> Mark elements
        </button>
        <button class="btn-apply" *ngIf="!callParentBoolean('isGroverOption')" (click)="callParentMethod('setFrequenciesWithUserExpressions')"
            [disabled]="parent?.userExpressions.length <= 0">
            <i class="fa fa-sliders-h" aria-hidden="true"></i> Fill frequencies
        </button>
    </div>
